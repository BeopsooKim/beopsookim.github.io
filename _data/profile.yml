short_bio: >-
  <p>
    👋 Glad to see you! 
  </p>  
  <p>My research interests include:</p>
  <ol>
    <li>Developing an optimal control algorithm for power systems with high penetration of renewable energy resources, and inverter/converter-based distributed energy resources (DERs) to enhance the stability and resilience of the power grid.</li>
    <li>Developing analysis algorithms of power system steady-state and transient analysis, including power flow, fault analysis, and protection coordination, to ensure the reliable operation of the power grid.</li>
    <li>Using optimization/control algorithms and theory to inform the design of more efficient and resilient power systems, including microgrids, virtual power plants, and energy storage systems.</li>
  </ol>
  <p>
    I look forward to continuing my work in power and energy systems, tackling challenging research problems and contributing to the development of more reliable, resilient, and sustainable electric power systems.
  </p>

